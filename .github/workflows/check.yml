name: HushJet stock check



on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub minimum) (UTC; GitHub may delay a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

concurrency:
  group: hushjet-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests==2.32.3

      # Restore last run's state.json so we only notify on a change
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: hushjet-state-${{ github.run_id }}
          restore-keys: hushjet-state-

      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_stock.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: hushjet-state-${{ github.run_id }}
